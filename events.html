<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Hub — Events</title>
  <link rel="stylesheet" href="events.css">
</head>
<body>
  <main class="events-page">
    <header class="events-header">
      <div>
        <p class="eyebrow">CAMPUS HUB</p>
        <h1>Events</h1>
        <p class="subtitle">Discover events from your clubs and activities open to the entire campus.</p>
      </div>
      <button id="createEventBtn" class="primary-btn hidden">Create Event</button>
    </header>

    <section id="errorState" class="state-card hidden"></section>
    <section id="loadingState" class="state-card">Loading events...</section>

    <section id="eventsContent" class="hidden">
      <section class="event-group" id="myClubSection">
        <div class="section-heading">
          <div>
            <h2>My Club Events</h2>
            <p>Events organized by clubs you belong to.</p>
          </div>
        </div>

        <div class="status-tabs" data-group="my-club">
          <button class="tab active" data-status="upcoming">Upcoming</button>
          <button class="tab" data-status="current">Current</button>
          <button class="tab" data-status="past">Past</button>
        </div>

        <div id="myClubEvents" class="event-grid"></div>
      </section>

      <section class="event-group">
        <div class="section-heading">
          <div>
            <h2>Open Events</h2>
            <p>Events from clubs that are open to everyone.</p>
          </div>
        </div>

        <div class="status-tabs" data-group="open">
          <button class="tab active" data-status="upcoming">Upcoming</button>
          <button class="tab" data-status="current">Current</button>
          <button class="tab" data-status="past">Past</button>
        </div>

        <div id="openEvents" class="event-grid"></div>
      </section>
    </section>
  </main>

  <div id="eventModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-card">
      <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="events.js"></script>
</body>
</html>
